# ==============================================================================
# PKC Events - High Performance Production Nginx Configuration
# Domain: pkcevents.com
# Upstream: Next.js Standalone (Port 3002)
# ==============================================================================

# 1. Upstream Next.js Cluster
upstream pkc_nextjs {
    server 127.0.0.1:3002;
    keepalive 64;
}

# 2. HTTP to HTTPS 301 Redirect
server {
    listen 80;
    listen [::]:80;
    server_name pkcevents.com www.pkcevents.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pkcevents.com www.pkcevents.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/pkcevents.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkcevents.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root Directory
    root /var/www/pkc;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable High-Efficiency Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # Maximum file upload size
    client_max_body_size 50M;

    # Direct Static Asset Serving: Next.js static build files
    location /_next/static/ {
        alias /var/www/pkc/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Direct Static Asset Serving: Public images, uploads, and media
    location ~* ^/(image|uploads|fonts|icons)/ {
        root /var/www/pkc/public;
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Direct Static Asset Serving: Root-level common assets
    location ~* ^/(favicon\.ico|logo\.png|robots\.txt|sitemap\.xml)$ {
        root /var/www/pkc/public;
        try_files $uri =404;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # Dynamic Next.js SSR & API routes
    location / {
        proxy_pass http://pkc_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Keepalive & Buffer optimizations
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
